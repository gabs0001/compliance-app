name: CI/CD Pipeline - ESG Compliance API

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # -------------------------------------------------------------
  # ETAPA 1: BUILD & TEST (CI)
  # -------------------------------------------------------------
  build-and-test:
    name: 🏗️ Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar e Executar Testes
        run: mvn test -Dspring.profiles.active=test

      - name: Empacotar Aplicação (.jar)
        run: mvn package -DskipTests

      - name: Armazenar Artifact do JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/compliance-0.0.1-SNAPSHOT.jar

  # -------------------------------------------------------------
  # ETAPA 2: BUILD DOCKER IMAGE & PUSH
  # -------------------------------------------------------------
  docker-build:
    name: 🐳 Docker Build & Push
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Baixar Artifact do JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Gerar Tags de Imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/compliance-api
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build e Push da Imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  # -------------------------------------------------------------
  # ETAPA 3: DEPLOY EM STAGING
  # -------------------------------------------------------------
  deploy-staging:
    name: 🚀 Deploy para Staging
    needs: docker-build
    runs-on: ubuntu-latest
    environment:
      name: staging

    steps:
      - name: Simulação de Deploy em Staging
        run: |
          echo "=================================================="
          echo "Iniciando Deploy no Ambiente de STAGING..."
          echo "Imagem Utilizada: ${{ secrets.DOCKERHUB_USERNAME }}/compliance-api:latest"
          echo "Executando container na porta 8081 (Staging)..."
          echo "Status: Deploy em STAGING concluído com sucesso! 🟢"
          echo "=================================================="

  # -------------------------------------------------------------
  # ETAPA 4: DEPLOY EM PRODUÇÃO
  # -------------------------------------------------------------
  deploy-production:
    name: 🛡️ Deploy para Produção
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Simulação de Deploy em Produção
        run: |
          echo "=================================================="
          echo "Iniciando Deploy no Ambiente de PRODUÇÃO..."
          echo "Imagem Utilizada: ${{ secrets.DOCKERHUB_USERNAME }}/compliance-api:latest"
          echo "Executando container na porta 8080 (Produção)..."
          echo "Status: Deploy em PRODUÇÃO concluído com sucesso! 🚀"
          echo "=================================================="